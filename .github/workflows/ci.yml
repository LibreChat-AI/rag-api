name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test_requirements.txt
          pip install -r requirements.extraction.txt

      - name: Run unit tests
        env:
          OPENAI_API_KEY: test_key
        run: |
          pytest --maxfail=1 --disable-warnings --junitxml=test-results-unit.xml

      - name: Run integration tests (pgvector container)
        env:
          OPENAI_API_KEY: test_key
        run: |
          pytest -m integration --maxfail=3 --disable-warnings --junitxml=test-results-integration.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results-*.xml